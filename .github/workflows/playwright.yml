name: Playwright Tests
on:
  workflow_dispatch:
  schedule:
    - cron: "6,36 22-23 * * *"
    - cron: "6,36 0-3 * * *"
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Geplante vs. Tatsächliche Zeit anzeigen
      run:  |
        RUN_ID=${{ github.run_id }}
        REPO=${{ github.repository }}
        TOKEN=${{ secrets.GITHUB_TOKEN }}
      
        API_URL="https://api.github.com/repos/$REPO/actions/runs/$RUN_ID"
      
        # API-Daten holen
        DATA=$(curl -s -H "Authorization: Bearer $TOKEN" "$API_URL")
      
        CREATED_AT=$(echo "$DATA" | jq -r '.created_at')
        STARTED_AT=$(echo "$DATA" | jq -r '.run_started_at')
      
        echo "Geplante Trigger-Zeit (UTC): $CREATED_AT"
        echo "Tatsächliche Startzeit (UTC): $STARTED_AT"
    - uses: actions/checkout@v7.0.0
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run:  npx playwright test
    - uses: actions/upload-artifact@v7.0.1
      name: upload test-report
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10
    - uses: actions/upload-artifact@v7.0.1
      name: upload screenshots
      if: ${{ !cancelled() }}
      with:
        name: screenshots
        path: screenshot*.png
        retention-days: 10
    - uses: actions/upload-artifact@v7.0.1
      name: upload html files
      if: ${{ !cancelled() }}
      with:
        name: html-files
        path: tests/tag*.html
        retention-days: 10
