name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Optional waiting time in minutes, maximum of 6 hours (360)"
        required: false
        type: number
#  schedule:
 #   - cron: "17,47 5,6,7,8,11,12,13,14 * * *"
jobs:
  test:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
    - name: Maybe wait
      if: ${{ github.event.inputs.wait_minutes != '' }}
      run: |
        WAIT_MINUTES="${{ github.event.inputs.wait_minutes }}"
        echo "Waiting for $WAIT_MINUTES minutes..."
    
        for ((i=WAIT_MINUTES; i>0; i--)); do
          TS=$(TZ="Europe/Berlin" date +"%H:%M:%S")
          echo "[$TS] ⏳ $i minute(s) remaining..."
          sleep 60
        done
        TS=$(TZ="Europe/Berlin" date +"%H:%M:%S")
        echo "[$TS]  Done waiting. Continuing..."
    - uses: actions/checkout@v7.0.0
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run:  npx playwright test
    - uses: actions/upload-artifact@v7.0.1
      name: upload test-report
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 3
    - uses: actions/upload-artifact@v7.0.1
      name: upload screenshots
      if: ${{ !cancelled() }}
      with:
        name: screenshots
        path: screenshot*.png
        retention-days: 10
    - uses: actions/upload-artifact@v7.0.1
      name: upload html files
      if: ${{ !cancelled() }}
      with:
        name: html-files
        path: tests/tag*.html
        retention-days: 10
